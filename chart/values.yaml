name: splash
# Rate limits and runtime feature flags are process-local; keep one replica until
# those controls use a shared store.
replicas: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: splash.super.fish
  annotations:
    kubernetes.io/tls-acme: "true"

image:
  repository: ghcr.io/depthbomb/splash
  tag: latest
  pullPolicy: Always

resources:
  limits:
    cpu: '1'
    memory: 1Gi

postgres:
  replicas: 2
  persistence:
    size: 5Gi
  resources:
    limits:
      cpu: '1'
      memory: 1Gi
